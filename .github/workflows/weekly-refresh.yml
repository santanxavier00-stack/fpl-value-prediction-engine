name: Weekly FPL refresh

# Runs the ingestion + model every Tuesday 06:00 UTC (after most gameweeks
# have finished settling), and lets you trigger it by hand from the Actions
# tab. Commits refreshed CSVs back to the repo so Power BI can pull them.
on:
  schedule:
    - cron: "0 6 * * 2"      # every Tuesday 06:00 UTC
  workflow_dispatch: {}       # manual "Run workflow" button

# Needed so the job can push the updated data/ files back to the repo.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Ingest FPL data
        run: python scripts/ingest.py

      # --- Modelling: choose ONE of the two blocks below. ---
      # Default: Python model (tested end-to-end). Comment this out and
      # uncomment the R block if you prefer to run the R version.
      - name: Model (Python)
        run: python scripts/model.py

      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Install R deps
      #   run: Rscript -e 'install.packages(c("readr","dplyr","tidyr","tidymodels","zoo","xgboost"), repos="https://cloud.r-project.org")'
      # - name: Model (R)
      #   run: Rscript scripts/model.R

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv data/last_updated.txt
          if git diff --staged --quiet; then
            echo "No data changes this run."
          else
            git commit -m "Weekly FPL data refresh: $(date -u +%Y-%m-%d)"
            git push
          fi
